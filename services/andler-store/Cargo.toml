[package]
name = "andler-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
andler-core = { path = "../../core/andler-core" }
# bundled — we link our own copy of libsqlite3, not system-wide:
# build environment (Docker dev-image, CI) does not require libsqlite3-dev,
# and sqlite version should not diverge between developer machines.
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }



[lints]
workspace = true
