[package]
name = "andler-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
andler-core = { path = "../../core/andler-core" }
# bundled — линкуем собственную копию libsqlite3, а не ищем системную:
# среда сборки (Docker dev-образ, CI) не обязана иметь libsqlite3-dev,
# и версия sqlite не должна расходиться между машинами разработчиков.
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
