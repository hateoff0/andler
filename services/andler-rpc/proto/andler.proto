syntax = "proto3";

package andler;

service AndlerService {
    rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);
    rpc CreateAndroidInstance(CreateAndroidInstanceRequest) returns (CreateInstanceResponse);
    rpc StartInstance(InstanceIdRequest) returns (Empty);
    rpc StopInstance(StopInstanceRequest) returns (Empty);
    rpc PauseInstance(InstanceIdRequest) returns (Empty);
    rpc ResumeInstance(InstanceIdRequest) returns (Empty);
    rpc GetInstanceStatus(InstanceIdRequest) returns (InstanceStatusResponse);
    rpc ListInstances(Empty) returns (ListInstancesResponse);
    rpc RemoveInstance(RemoveInstanceRequest) returns (Empty);
    rpc GetInstanceConfig(InstanceIdRequest) returns (GetInstanceConfigResponse);
    rpc GetConfigStatus(InstanceIdRequest) returns (GetConfigStatusResponse);
    rpc UpdateInstanceConfig(UpdateInstanceConfigRequest) returns (Empty);
    rpc StreamInstanceLogs(InstanceIdRequest) returns (stream LogLineResponse);
    rpc StreamResourceMetrics(InstanceIdRequest) returns (stream ResourceMetricsResponse);
    rpc CloneInstance(CloneInstanceRequest) returns (CreateInstanceResponse);
    rpc ExportInstanceDisk(ExportInstanceDiskRequest) returns (ExportInstanceDiskResponse);
    rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
    rpc RestoreSnapshot(RestoreSnapshotRequest) returns (Empty);
    rpc DeleteSnapshot(DeleteSnapshotRequest) returns (Empty);
    rpc ListSnapshots(InstanceIdRequest) returns (ListSnapshotsResponse);
    rpc InstallGuestAgent(InstallGuestAgentRequest) returns (Empty);
    rpc RemoveGuestAgent(RemoveGuestAgentRequest) returns (Empty);
    rpc ListGuestPackages(InstanceIdRequest) returns (ListGuestPackagesResponse);
    rpc SwitchArmTranslator(SwitchArmTranslatorRequest) returns (Empty);
    rpc SetInstanceConfig(SetInstanceConfigRequest) returns (Empty);
    rpc SwitchAndroidBootMode(SwitchAndroidBootModeRequest) returns (Empty);
    rpc GetAndroidBootMode(InstanceIdRequest) returns (GetAndroidBootModeResponse);
    rpc AttachDisk(AttachDiskRequest) returns (AttachDiskResponse);
    rpc DetachDisk(DetachDiskRequest) returns (Empty);
    rpc AttachNetwork(AttachNetworkRequest) returns (AttachNetworkResponse);
    rpc DetachNetwork(DetachNetworkRequest) returns (Empty);
    rpc ListOperations(Empty) returns (OpListResponse);
    rpc ExecCommand(ExecCommandRequest) returns (ExecCommandResponse);
    rpc CancelOperation(OpCancelRequest) returns (Empty);
}

message Empty {}

enum CpuPriority {
    CPU_PRIORITY_UNSPECIFIED = 0;
    LOW = 1;
    NORMAL = 2;
    HIGH = 3;
}

message CpuConfig {
    uint32 cores = 1;
    uint32 sockets = 2;
    uint32 threads = 3;
    repeated uint64 affinity = 4;
    CpuPriority priority = 5;
}

message MemoryConfig {
    uint64 size_bytes = 1;
    bool ballooning = 2;
    bool zram = 3;
    bool ksm = 4;
}

enum DiskFormat {
    DISK_FORMAT_UNSPECIFIED = 0;
    QCOW2 = 1;
    RAW = 2;
    VDI = 3;
}

enum CdromBus {
    CDROM_BUS_UNSPECIFIED = 0;
    VIRTIO_SCSI = 1;
    IDE = 2;
}

message DiskConfig {
    string path = 1;
    uint64 size_bytes = 2;
    DiskFormat format = 3;
    string base_image = 4;
    bool thin_provisioning = 5;
    bool trim_on_shutdown = 6;
    optional uint64 snapshot_timeout_secs = 7;
    bool compact_on_shutdown = 8;
}

message Resolution {
    uint32 width = 1;
    uint32 height = 2;
}

enum DisplayEngine {
    DISPLAY_ENGINE_UNSPECIFIED = 0;
    SDL = 1;
    SPICE = 2;
    DBUS = 3;
    DISPLAY_NONE = 4;
    GTK = 5;
}

message DisplayConfig {
    Resolution resolution = 1;
    uint32 dpi = 2;
    uint32 fps_limit = 3;
    DisplayEngine display_engine = 4;
    bool fullscreen = 5;
}

message RenderBackend {
    message Venus {}
    message VirtioGpu {}
    message VirGl {}
    message Cpu {}
    message Passthrough {
        string gpu_pci_id = 1;
    }

    oneof kind {
        Venus venus = 1;
        VirtioGpu virtio_gpu = 2;
        VirGl vir_gl = 3;
        Cpu cpu = 4;
        Passthrough passthrough = 5;
    }
}

message GpuConfig {
    RenderBackend render_backend = 1;
    uint64 hostmem_bytes = 2;
    bool blob = 3;
    bool gl = 4;
}

message NetworkMode {
    message Nat {}
    message Bridge {
        string interface = 1;
    }
    message Isolated {}

    oneof kind {
        Nat nat = 1;
        Bridge bridge = 2;
        Isolated isolated = 3;
    }
}

enum NatBackend {
    NAT_BACKEND_UNSPECIFIED = 0;
    SLIRP = 1;
    PASST = 2;
}
enum PortForwardProtocol {
    PORT_FORWARD_PROTOCOL_UNSPECIFIED = 0;
    TCP = 1;
    UDP = 2;
}

message PortForward {
    PortForwardProtocol protocol = 1;
    uint32 host_port = 2;
    uint32 guest_port = 3;
    string host_address = 4;
}

message NetworkConfig {
    NetworkMode mode = 1;
    string device_model = 2;
    NatBackend nat_backend = 3;
    repeated PortForward port_forwards = 4;
}

message FirmwareConfig {
    bool enable_uefi = 3;
    string ovmf_code_path = 1;
    string ovmf_vars_path = 2;
}

enum AudioBackend {
    AUDIO_BACKEND_UNSPECIFIED = 0;
    PIPEWIRE = 1;
    PULSEAUDIO = 2;
    AUDIO_NONE = 3;
}

enum AudioDevice {
    AUDIO_DEVICE_UNSPECIFIED = 0;
    VIRTIO_SOUND = 1;
    ICH9_HDA = 2;
}

message AudioConfig {
    AudioBackend backend = 1;
    AudioDevice device = 2;
}

enum PointerMode {
    POINTER_MODE_UNSPECIFIED = 0;
    TABLET = 1;
    MOUSE = 2;
}

message InputConfig {
    bool tablet_mode = 1;
    bool hide_host_cursor = 2;
    bool clipboard_enabled = 3;
    PointerMode pointer_mode = 4;
}

message CreateInstanceRequest {
    string name = 1;
    string iso_path = 2;
    CpuConfig cpu = 3;
    MemoryConfig memory = 4;
    DiskConfig disk = 5;
    DisplayConfig display = 6;
    GpuConfig gpu = 7;
    NetworkConfig network = 8;
    FirmwareConfig firmware = 9;
    AudioConfig audio = 10;
    InputConfig input = 11;
    CdromBus cdrom_bus = 12;
}

enum AndroidVersion {
    ANDROID_VERSION_UNSPECIFIED = 0;
    ANDROID_11 = 1;
    ANDROID_13 = 2;
}

enum ArmTranslator {
    ARM_TRANSLATOR_UNSPECIFIED = 0;
    ARM_TRANSLATOR_NONE = 1;
    LIBNDK = 2;
    LIBHOUDINI = 3;
}

message AndroidProfile {
    AndroidVersion android_version = 1;
    bool gapps = 2;
    bool microg = 3;
    reserved 4;
    reserved "libndk";
    ArmTranslator arm_translator = 6;
}

message CreateAndroidInstanceRequest {
    string name = 1;
    AndroidProfile profile = 2;
    string base_image_path = 3;
    string instances_root = 4;
    uint64 overlay_size_bytes = 5;
    string ovmf_vars_template = 6;
    reserved 7;
    bool linked_overlay = 8;
}

message CreateInstanceResponse {
    string instance_id = 1;
}

message InstanceIdRequest {
    string instance_id = 1;
}

message RemoveInstanceRequest {
    string instance_id = 1;
    bool purge = 2;
}

message StopInstanceRequest {
    string instance_id = 1;
    bool graceful = 2;
}

enum InstanceStateKind {
    INSTANCE_STATE_UNSPECIFIED = 0;
    CREATED = 1;
    STARTING = 2;
    RUNNING = 3;
    PAUSED = 4;
    STOPPING = 5;
    STOPPED = 6;
    ERROR = 7;
}

message InstanceStatusResponse {
    InstanceStateKind state = 1;
    string error_message = 2;
    string detail = 3;
}

message InstanceListEntry {
    string instance_id = 1;
    string name = 2;
    InstanceStateKind state = 3;
    string error_message = 4;
    optional string broken_reason = 5;
}

message ListInstancesResponse {
    repeated InstanceListEntry instances = 1;
}

enum BackendKind {
    BACKEND_KIND_UNSPECIFIED = 0;
    QEMU = 1;
}

message InstanceKind {
    message LinuxVm {
        string iso_path = 1;
        CdromBus cdrom_bus = 2;
    }
    message AndroidVm {
        AndroidProfile android_profile = 1;
    }

    oneof kind {
        LinuxVm linux_vm = 1;
        AndroidVm android_vm = 2;
    }
}

message GetInstanceConfigResponse {
    string instance_id = 1;
    string name = 2;
    InstanceKind kind = 3;
    BackendKind backend = 4;
    CpuConfig cpu = 5;
    MemoryConfig memory = 6;
    DiskConfig disk = 7;
    DisplayConfig display = 8;
    GpuConfig gpu = 9;
    NetworkConfig network = 10;
    FirmwareConfig firmware = 11;
    AudioConfig audio = 12;
    InputConfig input = 13;
    repeated DiskConfig extra_disks = 14;
    repeated NetworkConfig extra_networks = 15;
}

message UpdateInstanceConfigRequest {
    string instance_ref = 1;
    string name = 2;
    InstanceKind kind = 3;
    BackendKind backend = 4;
    CpuConfig cpu = 5;
    MemoryConfig memory = 6;
    DiskConfig disk = 7;
    DisplayConfig display = 8;
    GpuConfig gpu = 9;
    NetworkConfig network = 10;
    FirmwareConfig firmware = 11;
    AudioConfig audio = 12;
    InputConfig input = 13;
    repeated DiskConfig extra_disks = 14;
    repeated NetworkConfig extra_networks = 15;
}

enum LogStreamSource {
    LOG_STREAM_SOURCE_UNSPECIFIED = 0;
    STDOUT = 1;
    STDERR = 2;
}

message LogLineResponse {
    LogStreamSource source = 1;
    string line = 2;
}

enum CloneMode {
    CLONE_MODE_UNSPECIFIED = 0;
    LINKED = 1;
    FULL_STANDALONE = 2;
    SHARED_BASE = 3;
}

message CloneInstanceRequest {
    string source_instance_id = 1;
    string new_name = 2;
    string instances_root = 3;
    CloneMode mode = 4;
}

message ExportInstanceDiskRequest {
    string source_instance_id = 1;
    string dest_path = 2;
}

message ExportInstanceDiskResponse {
    string dest_path = 1;
}

message CreateSnapshotRequest {
    string instance_id = 1;
    string tag = 2;
    string description = 3;
    optional uint64 timeout_secs = 4;
}

message CreateSnapshotResponse {
    string snapshot_id = 1;
    string tag = 2;
    string created_at = 3;
}

message RestoreSnapshotRequest {
    string instance_id = 1;
    string tag = 2;
    optional uint64 timeout_secs = 3;
    // True: keep the current chain as an archived branch and continue from
    // the target. False (default): discard layers newer than the target.
    bool branch = 4;
}

message DeleteSnapshotRequest {
    string instance_id = 1;
    string tag = 2;
    optional uint64 timeout_secs = 3;
}

message SnapshotEntry {
    string snapshot_id = 1;
    string tag = 2;
    string description = 3;
    string created_at = 4;
    // Branch name for archived (non-main) branch snapshots; empty = main.
    string branch = 5;
}

message ListSnapshotsResponse {
    repeated SnapshotEntry snapshots = 1;
}

message OperationInfo {
    string op_id = 1;
    string instance_id = 2;
    string kind = 3;
    repeated OperationPhase phases = 4;
    double progress = 5;
    string state = 6;
    string error = 7;
}

message OperationPhase {
    string name = 1;
    double weight = 2;
}

message OpListResponse {
    repeated OperationInfo operations = 1;
}

message OpCancelRequest {
    string op_id = 1;
}

message ExecCommandRequest {
    string instance_id = 1;
    repeated string argv = 2;
    optional uint64 timeout_secs = 3;
}

message ExecCommandResponse {
    int32 exit_code = 1;
    string stdout = 2;
    string stderr = 3;
}

message ResourceMetricsResponse {
    optional float cpu_percent = 1;
    optional uint64 memory_used_bytes = 2;
    optional uint64 disk_read_bytes_per_sec = 3;
    optional uint64 disk_write_bytes_per_sec = 4;
    optional uint64 net_rx_bytes_per_sec = 5;
    optional uint64 net_tx_bytes_per_sec = 6;
    optional uint64 vram_used_bytes = 7;
    optional uint64 vram_total_bytes = 8;
    optional float gpu_load_percent = 9;
}

message InstallGuestAgentRequest {
    string instance_id = 1;
    string package = 2;
}

message RemoveGuestAgentRequest {
    string instance_id = 1;
    string package = 2;
}

message ListGuestPackagesResponse {
    repeated GuestPackageEntry packages = 1;
}

message SwitchArmTranslatorRequest {
    string instance_ref = 1;
    ArmTranslator translator = 2;
    string translator_dir = 3;
}

enum AndroidBootMode {
    ANDROID_BOOT_MODE_UNSPECIFIED = 0;
    ANDROID_BOOT_MODE_ANDROID = 1;
    ANDROID_BOOT_MODE_LINUX = 2;
}

message SwitchAndroidBootModeRequest {
    string instance_ref = 1;
    AndroidBootMode mode = 2;
}

message GetAndroidBootModeResponse {
    AndroidBootMode mode = 1;
}

message SetInstanceConfigRequest {
    string instance_ref = 1;
    string key = 2;
    string value = 3;
}

message ConfigKeyDiff {
    string key = 1;
    string file_value = 2;
    string memory_value = 3;
}

message GetConfigStatusResponse {
    string instance_id = 1;
    string name = 2;
    InstanceStateKind state = 3;
    repeated ConfigKeyDiff diffs = 4;
    optional string live_resolution = 5;
    optional string file_error = 6;
}

message AttachDiskRequest {
    string instance_id = 1;
    string path = 2;
    uint64 size_bytes = 3;
}

message AttachDiskResponse {
    string path = 1;
    uint32 index = 2;
}

message DetachDiskRequest {
    string instance_id = 1;
    string path = 2;
}

message AttachNetworkRequest {
    string instance_id = 1;
    NetworkConfig network = 2;
}

message AttachNetworkResponse {
    uint32 index = 1;
}

message DetachNetworkRequest {
    string instance_id = 1;
    uint32 index = 2;
}

message GuestPackageEntry {
    string name = 1;
    string description = 2;
    string status = 3;
}
