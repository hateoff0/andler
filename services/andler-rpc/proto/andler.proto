// gRPC-схема andlerd <-> andler (CLI)/GUI.
//
// СОЗНАТЕЛЬНО НЕПОЛНАЯ относительно §5.1 CORE_ARCHITECTURE_PLAN.md: там
// описан целевой набор методов (StreamResourceMetrics и т.п.) — здесь
// объявлены только методы, которые реально есть как методы
// `andler_daemon::Daemon` сегодня (включая `StreamInstanceLogs` и
// `CloneInstance`/`ExportInstanceDisk` — соответствуют
// `Daemon::stream_instance_logs`/`Daemon::clone_instance`/
// `Daemon::export_instance_disk`). Добавлять rpc-метод без
// соответствующего метода `Daemon` означало бы проектировать протокол
// вслепую — то, что явно решили не делать (см. README этого крейта и
// andler-daemon).
//
// `CloneInstance`/`ExportInstanceDisk` поддерживают как `AndroidVm`, так и
// `LinuxVm` (см. их документацию в `daemon.rs` за полным обоснованием).
//
// `CreateInstance` — generic-путь создания инстанса через явный
// `InstanceConfig`, соответствует `Daemon::create_instance` один-к-одному.
// Сознательно ограничен на `LinuxVm` (поле `iso_path`, без `oneof kind`
// с веткой Android) — `AndroidVm`-путь уже обслуживается отдельным
// `CreateAndroidInstance` (резолв профиля + создание overlay-диска на
// стороне демона перед вызовом того же `Daemon::create_instance`); делать
// этот метод полностью generic по `InstanceKind` означало бы дать клиенту
// два разных способа создать Android-инстанс (через профиль и через
// голый `InstanceConfig` с уже готовым diskconfig), что требовало бы
// клиенту самому собирать overlay/OVMF_VARS — то, что `CreateAndroidInstance`
// явно берёт на себя. Если когда-нибудь понадобится создавать `AndroidVm`
// из уже готового `InstanceConfig` напрямую (например, восстановление из
// экспортированной конфигурации) — это расширение поля `kind` в
// `CreateInstanceRequest` на `oneof`, не часть этого шага.
syntax = "proto3";

package andler;

service AndlerService {
    // Создаёт LinuxVm-инстанс из явного InstanceConfig — соответствует
    // Daemon::create_instance. См. комментарий выше про то, почему
    // ограничено на LinuxVm.
    rpc CreateInstance(CreateInstanceRequest) returns (CreateInstanceResponse);

    // Резолвит AndroidProfile в InstanceConfig и регистрирует инстанс —
    // соответствует Daemon::create_android_instance.
    rpc CreateAndroidInstance(CreateAndroidInstanceRequest) returns (CreateInstanceResponse);

    // Соответствуют Daemon::start_instance/stop_instance/pause_instance/
    // resume_instance/status один-к-одному.
    rpc StartInstance(InstanceIdRequest) returns (Empty);
    rpc StopInstance(StopInstanceRequest) returns (Empty);
    rpc PauseInstance(InstanceIdRequest) returns (Empty);
    rpc ResumeInstance(InstanceIdRequest) returns (Empty);
    rpc GetInstanceStatus(InstanceIdRequest) returns (InstanceStatusResponse);

    // Соответствует Daemon::list_instances. Возвращает только
    // id/name/state каждого инстанса (не полный InstanceConfig) — см.
    // комментарий у `Daemon::list_instances`/`InstanceSummary` за тем,
    // почему список не дёргает backend.status() по каждому инстансу.
    rpc ListInstances(Empty) returns (ListInstancesResponse);

    // Соответствует Daemon::remove_instance. Не останавливает запущенный
    // инстанс сама — см. подробное обоснование в комментарии у
    // `Daemon::remove_instance`. Файлы инстанса с диска удаляются только
    // если `RemoveInstanceRequest.purge == true` (см. там же).
    rpc RemoveInstance(RemoveInstanceRequest) returns (Empty);

    // Соответствует Daemon::get_instance_config. Возвращает полный
    // InstanceConfig одного инстанса — в отличие от ListInstances
    // (id/name/state на запись), это весь конфиг целиком; см.
    // комментарий у `Daemon::get_instance_config` за тем, почему это
    // отдельный метод, не часть ListInstances.
    rpc GetInstanceConfig(InstanceIdRequest) returns (GetInstanceConfigResponse);

    // Соответствует Daemon::stream_instance_logs. Server-streaming —
    // соединение остаётся открытым, пока клиент не отключится или сервер
    // не закроет поток сам (инстанс остановлен/удалён, либо у него
    // никогда не было запущенного backend'а — в этом случае поток сразу
    // же завершается пустым, не ошибкой, см. там же).
    //
    // Live-tail с момента подключения, без истории строк, написанных до
    // вызова — расширение до персистентного буфера осталось бы отдельным
    // шагом (см. обсуждение `StreamInstanceLogs` в истории проекта).
    rpc StreamInstanceLogs(InstanceIdRequest) returns (stream LogLineResponse);

    // Соответствует Daemon::clone_instance — поддерживает как AndroidVm,
    // так и LinuxVm (см. CloneInstanceRequest.mode/Daemon::clone_instance
    // за полным обоснованием трёх режимов).
    rpc CloneInstance(CloneInstanceRequest) returns (CreateInstanceResponse);

    // Соответствует Daemon::export_instance_disk — экспортирует диск
    // AndroidVm-инстанса в самостоятельный файл по указанному пути, не
    // создаёт новый инстанс (в отличие от CloneInstance с
    // CloneMode::FULL_STANDALONE, который создаёт). См. документацию
    // Daemon::export_instance_disk за тем, почему это отдельный метод,
    // не вариант CloneInstance.
    rpc ExportInstanceDisk(ExportInstanceDiskRequest) returns (ExportInstanceDiskResponse);

    // Snapshot-операции — соответствуют Daemon::create_snapshot/
    // restore_snapshot/delete_snapshot/list_snapshots.
    rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
    rpc RestoreSnapshot(RestoreSnapshotRequest) returns (Empty);
    rpc DeleteSnapshot(DeleteSnapshotRequest) returns (Empty);
    rpc ListSnapshots(InstanceIdRequest) returns (ListSnapshotsResponse);

    // Соответствует Daemon::stream_resource_metrics. Server-streaming —
    // соединение остаётся открытым, пока клиент не отключится, процесс
    // не завершится, или не исчезнут подписчики (аналогично
    // StreamInstanceLogs). Метрики публикуются каждую секунду из
    // /proc/<pid>/ (CPU%, RAM, disk I/O, network I/O).
    rpc StreamResourceMetrics(InstanceIdRequest) returns (stream ResourceMetricsResponse);
}

message Empty {}

// --- InstanceConfig: типы, общие для CreateInstanceRequest -------------
//
// Каждый message/enum здесь соответствует одному типу из
// `andler_core::config` один-к-одному по полям — см. соответствующий
// файл в `andler-core/src/config/` для документации смысла каждого поля
// (proto-схема намеренно не повторяет эти комментарии, чтобы не давать
// им расходиться).

enum CpuPriority {
    CPU_PRIORITY_UNSPECIFIED = 0;
    LOW = 1;
    NORMAL = 2;
    HIGH = 3;
}

message CpuConfig {
    uint32 cores = 1;
    uint32 sockets = 2;
    uint32 threads = 3;
    // Пустой список — это `andler_core::CpuConfig.affinity == None`
    // (без привязки к физическим ядрам), не "привязка к нулю ядер" —
    // конвертация (`convert.rs`) трактует absence/empty одинаково,
    // так как `repeated` в proto3 не различает "не задано" и "задано
    // пустым". Это симметрично остальным `repeated`-полям ниже, где их
    // нет, но решение то же самое: пустой ⇒ None.
    repeated uint64 affinity = 4;
    CpuPriority priority = 5;
}

message MemoryConfig {
    uint64 size_bytes = 1;
    bool ballooning = 2;
    bool zram = 3;
    bool ksm = 4;
}

enum DiskFormat {
    DISK_FORMAT_UNSPECIFIED = 0;
    QCOW2 = 1;
    RAW = 2;
    VDI = 3;
}

message DiskConfig {
    string path = 1;
    uint64 size_bytes = 2;
    DiskFormat format = 3;
    // Пустая строка ⇒ `base_image: None` (обычный самостоятельный диск
    // без backing chain) — см. `andler_core::DiskConfig.base_image`.
    // `CreateInstance` создаёт LinuxVm с диском с нуля (см. комментарий
    // у `rpc CreateInstance` выше), поэтому на практике это поле для
    // этого пути почти всегда пустое; оставлено в схеме, а не убрано,
    // чтобы `DiskConfig` здесь оставался полным отражением домена, а не
    // урезанным под один сценарий вызова.
    string base_image = 4;
    bool thin_provisioning = 5;
    bool trim_on_shutdown = 6;
    // Таймаут async job (snapshot-save/load/delete) в секундах.
    // 0 или отсутствие = 30 секунд по умолчанию.
    optional uint64 snapshot_timeout_secs = 7;
}

message Resolution {
    uint32 width = 1;
    uint32 height = 2;
}

enum DisplayEngine {
    DISPLAY_ENGINE_UNSPECIFIED = 0;
    SDL = 1;
    SPICE = 2;
    DBUS = 3;
    // `DISPLAY_NONE`, не `NONE` — значения proto3 enum делят общее
    // пространство имён на уровне package (см. тот же приём для
    // `AUDIO_NONE` в `AudioBackend` ниже); голый `NONE` столкнулся бы с
    // другими enum'ами в этом файле.
    DISPLAY_NONE = 4;
}

message DisplayConfig {
    Resolution resolution = 1;
    uint32 dpi = 2;
    uint32 fps_limit = 3;
    DisplayEngine display_engine = 4;
    bool fullscreen = 5;
}

// `oneof` — `andler_core::RenderBackend` не C-style enum (`Passthrough`
// несёт `gpu_pci_id: String`), поэтому, в отличие от `CpuPriority`/
// `DiskFormat`/`DisplayEngine` выше, не выражается обычным proto `enum`.
message RenderBackend {
    message Venus {}
    message VirtioGpu {}
    message VirGl {}
    message Cpu {}
    message Passthrough {
        string gpu_pci_id = 1;
    }

    oneof kind {
        Venus venus = 1;
        VirtioGpu virtio_gpu = 2;
        VirGl vir_gl = 3;
        Cpu cpu = 4;
        Passthrough passthrough = 5;
    }
}

message GpuConfig {
    RenderBackend render_backend = 1;
    uint64 hostmem_bytes = 2;
    bool blob = 3;
    bool gl = 4;
}

// `oneof` — как `RenderBackend` выше: `andler_core::NetworkMode::Bridge`
// несёт `interface: String`.
message NetworkMode {
    message Nat {}
    message Bridge {
        string interface = 1;
    }
    message Isolated {}

    oneof kind {
        Nat nat = 1;
        Bridge bridge = 2;
        Isolated isolated = 3;
    }
}

message NetworkConfig {
    NetworkMode mode = 1;
    string device_model = 2;
}

message FirmwareConfig {
    string ovmf_code_path = 1;
    string ovmf_vars_path = 2;
}

enum AudioBackend {
    AUDIO_BACKEND_UNSPECIFIED = 0;
    PIPEWIRE = 1;
    PULSEAUDIO = 2;
    AUDIO_NONE = 3;
}

message AudioConfig {
    AudioBackend backend = 1;
}

message InputConfig {
    bool tablet_mode = 1;
    bool hide_host_cursor = 2;
    bool clipboard_enabled = 3;
}

// Поля соответствуют `andler_core::InstanceConfig` для
// `InstanceKind::LinuxVm` один-к-одному: `id`/`backend` здесь не
// передаются — `id` генерируется демоном (`InstanceId::new()`, как и в
// `create_android_instance`), `backend` всегда `BackendKind::Qemu`
// (единственный зарегистрированный backend сегодня, см. `Daemon::new`
// /`default_backends`) и не имеет смысла как параметр запроса, который
// клиент мог бы перепутать.
message CreateInstanceRequest {
    string name = 1;
    string iso_path = 2;
    CpuConfig cpu = 3;
    MemoryConfig memory = 4;
    DiskConfig disk = 5;
    DisplayConfig display = 6;
    GpuConfig gpu = 7;
    NetworkConfig network = 8;
    FirmwareConfig firmware = 9;
    AudioConfig audio = 10;
    InputConfig input = 11;
}

enum AndroidVersion {
    ANDROID_VERSION_UNSPECIFIED = 0;
    ANDROID_11 = 1;
    ANDROID_13 = 2;
}

enum RootMode {
    ROOT_MODE_UNSPECIFIED = 0;
    ROOT_MODE_NONE = 1;
    ROOT_MODE_MAGISK = 2;
    ROOT_MODE_KERNEL_SU = 3;
}

message AndroidProfile {
    AndroidVersion android_version = 1;
    bool gapps = 2;
    bool microg = 3;
    bool libndk = 4;
    RootMode root = 5;
}

// Поля соответствуют параметрам Daemon::create_android_instance
// один-к-одному — см. документацию там про смысл каждого пути.
message CreateAndroidInstanceRequest {
    string name = 1;
    AndroidProfile profile = 2;
    string base_image_path = 3;
    string instances_root = 4;
    uint64 overlay_size_bytes = 5;
    string ovmf_vars_template = 6;
    // Каталог с бинарниками Magisk (результат распаковки Magisk release ZIP).
    // Обязателен, если profile.root == ROOT_MODE_MAGISK. Если не указан при
    // root=magisk, daemon вернёт INVALID_ARGUMENT. Игнорируется при root !=
    // Magisk (поле просто не используется, даже если передано).
    string magisk_dir = 7;
}

message CreateInstanceResponse {
    string instance_id = 1;
}

message InstanceIdRequest {
    string instance_id = 1;
}

// См. комментарий у `rpc RemoveInstance` и у `Daemon::remove_instance` за
// полным обоснованием `purge`. Отдельное сообщение, не переиспользование
// `InstanceIdRequest` — добавлять `purge` туда означало бы тащить это
// поле во все остальные методы, которые принимают `InstanceIdRequest`
// (`StartInstance`/`PauseInstance`/`ResumeInstance`/`GetInstanceStatus`/
// `GetInstanceConfig`), для которых оно не имеет смысла.
message RemoveInstanceRequest {
    string instance_id = 1;
    // false (по умолчанию) — файлы инстанса на диске не трогаются. true —
    // удалить disk.path и firmware.ovmf_vars_path после удаления записи
    // (никогда не base_image/ovmf_code_path — общие для нескольких
    // инстансов файлы).
    bool purge = 2;
}

message StopInstanceRequest {
    string instance_id = 1;
    bool graceful = 2;
}

// Соответствует andler_core::InstanceState один-к-одному (см. fsm.rs).
enum InstanceStateKind {
    INSTANCE_STATE_UNSPECIFIED = 0;
    CREATED = 1;
    STARTING = 2;
    RUNNING = 3;
    PAUSED = 4;
    STOPPING = 5;
    STOPPED = 6;
    ERROR = 7;
}

message InstanceStatusResponse {
    InstanceStateKind state = 1;
    // Заполнено только при state == ERROR (соответствует
    // InstanceState::Error.message).
    string error_message = 2;
    // Доп. диагностика из BackendStatus::detail, если backend её дал
    // (например, "instance has no running backend handle").
    string detail = 3;
}

// Одна строка ListInstancesResponse — зеркало
// `andler_daemon::daemon::InstanceSummary`. Названо `InstanceListEntry`,
// не `InstanceSummary`, чтобы избежать одноимённости с доменным типом
// при чтении кода на стороне Rust (`andler_rpc::proto::InstanceSummary`
// vs `andler_daemon::InstanceSummary` было бы легко перепутать в одном
// файле конвертации). `error_message`/`detail` сознательно отсутствуют
// здесь, в отличие от `InstanceStatusResponse` — `Daemon::list_instances`
// не обращается к backend'у и не имеет `BackendStatus::detail`; точная
// причина ошибки конкретного инстанса остаётся за `GetInstanceStatus`.
message InstanceListEntry {
    string instance_id = 1;
    string name = 2;
    InstanceStateKind state = 3;
}

message ListInstancesResponse {
    repeated InstanceListEntry instances = 1;
}

// Зеркало `andler_core::BackendKind`. Единственный зарегистрированный
// backend сегодня — QEMU (см. `Daemon::default_backends`) — VMM включён
// в схему для полноты ответа GetInstanceConfig, не потому что он сейчас
// достижим на практике.
enum BackendKind {
    BACKEND_KIND_UNSPECIFIED = 0;
    QEMU = 1;
    VMM = 2;
}

// Зеркало `andler_core::InstanceKind` — `oneof`, не C-style enum, так
// как оба варианта несут данные (`LinuxVm.iso_path`,
// `AndroidVm.android_profile`).
message InstanceKind {
    message LinuxVm {
        string iso_path = 1;
    }
    message AndroidVm {
        AndroidProfile android_profile = 1;
    }

    oneof kind {
        LinuxVm linux_vm = 1;
        AndroidVm android_vm = 2;
    }
}

// Ответ GetInstanceConfig — полный `InstanceConfig` инстанса, включая
// `id`/`backend`/`kind`, которые `CreateInstanceRequest` сознательно не
// принимает на входе (см. комментарий там) — здесь, в ответе на чтение,
// показывать их естественно: клиент уже знает `instance_id` из запроса,
// но получает его обратно для самодостаточности ответа (не нужно
// сопоставлять с исходным запросом вручную), и видит, какой backend
// реально использует инстанс.
message GetInstanceConfigResponse {
    string instance_id = 1;
    string name = 2;
    InstanceKind kind = 3;
    BackendKind backend = 4;
    CpuConfig cpu = 5;
    MemoryConfig memory = 6;
    DiskConfig disk = 7;
    DisplayConfig display = 8;
    GpuConfig gpu = 9;
    NetworkConfig network = 10;
    FirmwareConfig firmware = 11;
    AudioConfig audio = 12;
    InputConfig input = 13;
}

// Источник строки лога — см. `andler_core::LogStreamSource` за полным
// обоснованием того, почему здесь только stdout/stderr самого процесса
// гипервизора, не структурированные FSM-события и не гостевые логи.
//
// `LOG_STREAM_SOURCE_UNSPECIFIED = 0` недостижим на практике: сервер сам
// заполняет это поле в каждом `LogLineResponse` (в отличие от
// `CpuPriority`/`AndroidVersion`/`RootMode`, которые парсятся из
// клиентских запросов и поэтому нуждаются в `TryFrom`-проверке на
// unspecified) — оставлен здесь только для консистентности со
// стилем остальных enum'ов этого файла (см. их комментарии), не
// потому что отсутствие этого варианта было бы поведенческой проблемой.
enum LogStreamSource {
    LOG_STREAM_SOURCE_UNSPECIFIED = 0;
    STDOUT = 1;
    STDERR = 2;
}

// Одна строка вывода через `rpc StreamInstanceLogs`. Соответствует
// `andler_core::LogLine` один-к-одному — см. конвертацию в
// `andler-rpc/src/convert.rs`.
message LogLineResponse {
    LogStreamSource source = 1;
    string line = 2;
}

// Соответствует `andler_core::CloneMode` один-к-одному — см. его
// документацию за полным обоснованием каждого варианта.
enum CloneMode {
    CLONE_MODE_UNSPECIFIED = 0;
    LINKED = 1;
    FULL_STANDALONE = 2;
    SHARED_BASE = 3;
}

// Поля соответствуют параметрам Daemon::clone_instance один-к-одному.
// Только для AndroidVm — см. документацию там за тем, почему LinuxVm не
// поддерживается (нет управляемого instances_root, куда можно было бы
// детерминированно положить файлы клона).
message CloneInstanceRequest {
    string source_instance_id = 1;
    string new_name = 2;
    string instances_root = 3;
    CloneMode mode = 4;
}

// Поля соответствуют параметрам Daemon::export_instance_disk
// один-к-одному. Не создаёт новый инстанс (см. комментарий у
// `rpc ExportInstanceDisk` за тем, почему это отдельный метод, не
// вариант CloneInstance) — ответ эхо подтверждает путь, не возвращает
// instance_id, так как никакого instance_id не существует.
message ExportInstanceDiskRequest {
    string source_instance_id = 1;
    string dest_path = 2;
}

message ExportInstanceDiskResponse {
    string dest_path = 1;
}

// --- Snapshot-операции ---------------------------------------------------

message CreateSnapshotRequest {
    string instance_id = 1;
    string tag = 2;
    string description = 3;
}

message CreateSnapshotResponse {
    string snapshot_id = 1;
    string tag = 2;
    string created_at = 3;
}

message RestoreSnapshotRequest {
    string instance_id = 1;
    string tag = 2;
}

message DeleteSnapshotRequest {
    string instance_id = 1;
    string tag = 2;
}

message SnapshotEntry {
    string snapshot_id = 1;
    string tag = 2;
    string description = 3;
    string created_at = 4;
}

message ListSnapshotsResponse {
    repeated SnapshotEntry snapshots = 1;
}

// --- Resource Metrics ----------------------------------------------------

// Одна выборка метрик ресурсов через `rpc StreamResourceMetrics`.
// Все поля опциональны — если источник недоступен (процесс завершился,
// /proc не читается), поле опущено (proto3 optional).
message ResourceMetricsResponse {
    optional float cpu_percent = 1;
    optional uint64 memory_used_bytes = 2;
    optional uint64 disk_read_bytes_per_sec = 3;
    optional uint64 disk_write_bytes_per_sec = 4;
    optional uint64 net_rx_bytes_per_sec = 5;
    optional uint64 net_tx_bytes_per_sec = 6;
    // GPU metrics — доступны только для AMD GPU (через sysfs DRM).
    // Для других вендоров или virtio-gpu без passthrough — опущены.
    optional uint64 vram_used_bytes = 7;
    optional uint64 vram_total_bytes = 8;
    optional float gpu_load_percent = 9;
}
