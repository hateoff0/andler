[package]
name = "andler-disk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
andler-core = { path = "../../core/andler-core" }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = "0.2"
reqwest = { version = "0.12", features = ["rustls-tls"], default-features = false }
md5 = "0.7"
zip = "0.6"
serde_json = "1"
# zstd is already in the tree (zip decompresses its own archives with it), so
# pulling base-image releases in costs no extra compilation; sha2 matches the
# workspace's single hashing implementation for image verification.
zstd = "0.11"
sha2 = { workspace = true }
serde = { workspace = true }



[lints]
workspace = true
