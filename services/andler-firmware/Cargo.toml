[package]
name = "andler-firmware"
description = "UEFI/OVMF firmware detection and provisioning for ANDLER"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
andler-core = { path = "../../core/andler-core" }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# NVIDIA Management Library — динамически подгружается через `libloading`
# в рантайме (не линкуется на этапе сборки), поэтому безопасно как
# обычная (не opt-in/feature-gated) зависимость: на хостах без
# NVIDIA-драйвера `Nvml::init()` просто возвращает `Err`, ничего не падает
# и не требует наличия `libnvidia-ml.so` для самой сборки крейта. См.
# `metrics/gpu_nvidia.rs`, PLAN.md, раздел "NVIDIA metrics".
nvml-wrapper = "0.12"
