[package]
name = "andler-firmware"
description = "UEFI/OVMF firmware detection and provisioning for ANDLER"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
andler-core = { path = "../../core/andler-core" }
thiserror = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# NVIDIA Management Library — dynamically loaded via `libloading`
# at runtime (not linked at build time), so safe as a regular
# dependency: on hosts without NVIDIA driver, `Nvml::init()`
# simply returns `Err`, nothing crashes
# and `libnvidia-ml.so` is not required for building. See
# `metrics/gpu_nvidia.rs`, docs/ARCHITECTURE.md section "GPU Metrics".
nvml-wrapper = "0.12"
