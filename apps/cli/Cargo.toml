[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "andler"
path = "src/main.rs"

[dependencies]
andler-core = { path = "../../core/andler-core" }
andler-disk = { path = "../../services/andler-disk" }
andler-firmware = { path = "../../services/andler-firmware" }
andler-qemu = { path = "../../backends/andler-qemu" }
andler-rpc = { path = "../../services/andler-rpc" }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4.6"
indicatif = "0.18"
serde = { workspace = true }
serde_json = "1"
regex = "1"
thiserror = { workspace = true }
toml = "0.8"
# Interactive wizard — arrows/Enter/Space (Select/MultiSelect/Text/Confirm).
# Chosen over ratatui: sequential prompts, not full-screen TUI;
# inquire provides exactly the needed UX without extra complexity.
# Version locked — inquire API is unstable between minor versions.
inquire = "0.7"
chrono = { version = "0.4", features = ["serde"] }



[lints]
workspace = true
