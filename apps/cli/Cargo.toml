[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "andler"
path = "src/main.rs"

[dependencies]
andler-core = { path = "../../core/andler-core" }
andler-disk = { path = "../../services/andler-disk" }
andler-firmware = { path = "../../services/andler-firmware" }
andler-qemu = { path = "../../backends/andler-qemu" }
andler-rpc = { path = "../../services/andler-rpc" }
rand = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4.6"
indicatif = "0.18"
serde = { workspace = true }
serde_json = "1"
regex = "1"
thiserror = { workspace = true }
toml = "0.8"
# Interactive prompts — arrows/Enter/Space (Select/MultiSelect/Input/Confirm)
# plus spinner and progress-bar rendering.
# Chosen over ratatui: sequential prompts, not a full-screen TUI.
# Chosen over inquire: typed `Select<T>`/`MultiSelect<T>` take the value, its
# label and its hint separately (no encoding meaning in a label string and
# parsing it back), `initial_value` sets the default by value rather than by
# list position, and the progress bars share the same look and the same
# `indicatif` engine the rest of the CLI already renders with.
cliclack = "0.5"
# Already in the tree through cliclack and indicatif; a direct dependency for
# the `Style` type its `Theme` trait is defined in (apps/cli/src/theme.rs).
console = "0.16"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"



[lints]
workspace = true
