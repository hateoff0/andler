# Desktop template: SDL window, GPU-accelerated rendering, audio.
# These values are the same as InstanceConfig's own defaults (core::config
# Default impls) — the defaults are already desktop-oriented, so this
# template exists for an explicit, discoverable `--template desktop` rather
# than to change anything. `headless` is the one that actually differs.
[gpu]
render_backend = "venus"
hostmem_bytes = 4294967296
blob = true
gl = true

[display]
resolution = { width = 1920, height = 1080 }
dpi = 96
fps_limit = 0
engine = "sdl"
fullscreen = false

[audio]
backend = "pipewire"
device = "virtiosound"
