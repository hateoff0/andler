[package]
name = "daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "andlerd"
path = "src/main.rs"

[dependencies]
andler-core = { path = "../../core/andler-core" }
andler-qemu = { path = "../../backends/andler-qemu" }
andler-disk = { path = "../../services/andler-disk" }
andler-firmware = { path = "../../services/andler-firmware" }
andler-guestfs = { path = "../../services/andler-guestfs" }
andler-rpc = { path = "../../services/andler-rpc" }
andler-store = { path = "../../services/andler-store" }
tonic = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5"
# instance.toml is the single source of truth for instance configuration;
# the daemon scans it on startup and writes it on config changes.
toml = "0.8"
libc = "0.2"
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1" }
rusqlite = "0.31"



[lints]
workspace = true
