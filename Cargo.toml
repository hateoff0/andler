[workspace]
resolver = "2"
members = [
    "core/andler-core",
    "backends/andler-qemu",
    "services/andler-disk",
    "services/andler-firmware",
    "services/andler-net",
    "services/andler-store",
    "services/andler-rpc",
    "apps/daemon",
    "apps/cli",
    "apps/helper",
]

[workspace.package]
version = "0.1.0"
license = "GPL-3.0-only"
edition = "2021"

[workspace.dependencies]
# Common dependencies versioned in one place to avoid
# version drift across workspace crates.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "net", "sync", "time", "io-util", "signal"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
tracing = "0.1"
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
dirs = "5"
rand = "0.10"

[profile.dev]
# Full debug builds of QEMU wrapper often require live processes —
# keep panic readable without sacrificing test performance.
opt-level = 0

[profile.release]
lto = true
strip = true
