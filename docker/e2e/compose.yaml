services:
  # Full workspace unit tests. No KVM, works anywhere.
  unit-test:
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: unit-test

  # #[ignore] tests (qemu-img, QMP round-trip, spawn). Requires /dev/kvm.
  integration-test:
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: integration-test
    devices:
      - /dev/kvm

  # Full E2E suite (docker/e2e/e2e.sh). Requires /dev/kvm.
  # privileged is needed for the deep guest tests (guestfish appliance,
  # offline package install/list). /lib/modules is deliberately NOT bind-
  # mounted: the guestfish appliance boots the Debian kernel shipped in the
  # image and needs the matching Debian modules — the host's modules would
  # be loaded instead and the appliance would hang waiting for its root.
  e2e:
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: e2e
    devices:
      - /dev/kvm
    privileged: ${E2E_PRIVILEGED:-true}
    environment:
      E2E_DEEP_GUEST: "1"

  # andlerd in a container for manual experiments (not a distribution channel —
  # see docker/e2e/README.md).
  daemon:
    build:
      context: ../..
      dockerfile: docker/e2e/Dockerfile
      target: daemon
    devices:
      - /dev/kvm
    environment:
      ANDLER_HOME: /var/lib/andler
    volumes:
      - andler-data:/var/lib/andler

volumes:
  andler-data:
