# Without this, every service's stdout/stderr (weston, waydroid, anything else)
# only goes to the journal — invisible from outside the VM, since there's no way to
# get a shell in here yet if the graphical session itself is what's broken. Forwarding
# to /dev/console makes it show up in andler's own console.log capture (see
# backends/andler-qemu/src/cmdline.rs's -serial flag), which is otherwise the only
# window into what's happening during boot.
[Journal]
ForwardToConsole=yes
MaxLevelConsole=info
