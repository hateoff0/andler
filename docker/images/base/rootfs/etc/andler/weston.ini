# Weston configuration for the ANDLER Android session.
#
# The DRM backend takes the seat and VT of the logind session created by
# waydroid-compositor.service (PAMName=login + TTYPath=/dev/tty1) and
# composites output through the GL renderer (virgl in the guest) — the same
# path the Linux VM's KDE session uses.
#
# This file is the base; the wanted output mode is appended at startup by
# andler-waydroid-compositor (which reads RESOLUTION=WxH from
# /etc/andler/display.conf, defaulting to 1920x1080 to match the instance
# display.resolution). The mode must exist in virtio-gpu's EDID ("Red Hat,
# Inc. QEMU Monitor" carries 1920x1080@60 and friends — verified in a boot
# log: "Output Virtual-1 ... video modes: ... 1920x1080@60.0").
[core]
backend=drm
shell=kiosk
idle-time=0
renderer=auto