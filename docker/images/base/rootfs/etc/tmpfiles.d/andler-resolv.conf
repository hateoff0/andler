# /etc/resolv.conf cannot be baked into the image: docker build bind-mounts
# its own resolv.conf over that path during RUN steps (ln inside a RUN fails
# with EBUSY) and never commits it. Worse, docker export injects an EMPTY
# regular /etc/resolv.conf into the rootfs tar (build-disk.sh exports the
# image), so the guest disk ends up with a 0-byte file that shadows any
# content. The guest itself resolves through systemd-resolved (per-link DHCP
# DNS), but the waydroid container's dnsmasq reads /etc/resolv.conf for its
# upstream and with an empty file has zero DNS (ERR_NAME_NOT_RESOLVED in
# Android apps). L+ unconditionally replaces any existing file/empty file
# with a symlink to resolved's stub (plain L silently skips existing files,
# and Arch's own L! in systemd-resolve.conf gets dropped as a duplicate):
# dnsmasq -> 127.0.0.53 -> resolved -> slirp DHCP server (10.0.2.3) -> host.
L+ /etc/resolv.conf - - - - /run/systemd/resolve/stub-resolv.conf
