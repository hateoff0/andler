# Локальные шорткаты вокруг docker/Dockerfile.dev.
#
# Использование:
#   docker compose run --rm unit-test
#   docker compose run --rm integration-test     # требует KVM на хосте
#   docker compose up daemon
#
# Это не продуктовый деплой — andlerd предполагается распространять через
# packaging/ (.deb/.rpm/AUR/AppImage), а не как Docker-образ для конечного
# пользователя (GUI на хосте должен иметь прямой доступ к /dev/kvm и
# дисплею хоста, что плохо сочетается с контейнеризацией демона в
# продуктовом сценарии). Этот compose-файл — только для разработки и CI.

services:
  unit-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: unit-test
    # Без /dev/kvm намеренно — см. комментарий в Dockerfile.dev про
    # таргет unit-test.

  integration-test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: integration-test
    devices:
      - /dev/kvm
    # На хосте без /dev/kvm (например, без виртуализации в BIOS, или
    # пользователь не в группе kvm) этот сервис не запустится — см.
    # docs/architecture/CORE_ARCHITECTURE_PLAN.md, §10.

  daemon:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
      target: daemon
    devices:
      - /dev/kvm
    volumes:
      - andler-data:/var/lib/andler

volumes:
  andler-data:
