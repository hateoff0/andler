[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "andler"
path = "src/main.rs"

[dependencies]
andler-core = { path = "../core/andler-core" }
andler-disk = { path = "../services/andler-disk" }
andler-firmware = { path = "../services/andler-firmware" }
andler-qemu = { path = "../backends/andler-qemu" }
andler-rpc = { path = "../services/andler-rpc" }
tonic = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = "4.6"
indicatif = "0.18"
serde = { workspace = true }
serde_json = "1"
regex = "1"
thiserror = { workspace = true }
toml = "0.8"
# Интерактивный wizard — стрелки/Enter/Space (Select/MultiSelect/Text/Confirm).
# Выбран вместо ratatui: это последовательные prompt'ы, не full-screen TUI;
# inquire реализует ровно нужный UX без лишней сложности.
# Версия зафиксирована — API inquire нестабилен между minor-версиями.
inquire = "0.7"
