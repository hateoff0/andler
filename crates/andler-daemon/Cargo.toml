[package]
name = "andler-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "andlerd"
path = "src/main.rs"

[dependencies]
andler-core = { path = "../andler-core" }
andler-qemu = { path = "../andler-qemu" }
andler-disk = { path = "../andler-disk" }
andler-rpc = { path = "../andler-rpc" }
andler-store = { path = "../andler-store" }
tonic = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net"] }
uuid = { version = "1" }
