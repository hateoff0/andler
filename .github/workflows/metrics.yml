name: Metrics

# Renders repository metrics into assets/metrics.svg and commits it back.
# The README embeds that committed file, so no external image host and no
# per-request rate limit sits between the repository and its stats.
#
# Requires a METRICS_TOKEN repository secret (a PAT with `repo` read access;
# add `gist` only if a gist output is configured). Without the secret the job
# skips itself rather than failing, so forks and fresh clones stay green.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check for METRICS_TOKEN
        id: guard
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -n "$METRICS_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Metrics::METRICS_TOKEN is not set - skipping the render. Add it under Settings -> Secrets and variables -> Actions to enable it."
          fi

      - name: Ensure the output directory exists
        if: steps.guard.outputs.enabled == 'true'
        run: mkdir -p assets

      - name: Render repository metrics
        if: steps.guard.outputs.enabled == 'true'
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hateoff0
          repo: andler
          filename: assets/metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_timezone: UTC
          committer_message: "chore(metrics): update repository metrics"
