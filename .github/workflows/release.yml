name: Release

# Publishes the project binaries for a version tag:
#
#   git tag -a v0.1.0 -m "ANDLER 0.1.0" && git push origin v0.1.0
#
# The archive layout matches the README's install instructions: `andler` and
# `andlerd` sit at the archive root, so `tar -xzf andler-*.tar.gz` drops both
# binaries next to each other. Automated base-image builds publish their own
# `base-image-*` releases with `--latest=false`, so `releases/latest` keeps
# pointing at the project release.
#
# Add targets by extending the packaging steps (a musl build needs
# `rustup target add x86_64-unknown-linux-musl` plus a musl toolchain); the
# current release ships the glibc x86_64 build only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (must already be pushed)
        required: true
        type: string

permissions:
  contents: write      # create the release and upload assets
  id-token: write      # sign the build provenance attestation
  attestations: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2

      - name: Resolve the tag and version
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          case "$tag" in
            v*) ;;
            *) echo "::error::tag '$tag' must start with 'v'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binaries
        run: cargo build --release --locked -p daemon -p cli

      - name: Package the artifacts
        id: package
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          base="linux-x86_64"
          bundle="andler-${tag}-${base}"
          daemon="andlerd-${tag}-${base}"
          cli="andler-cli-${tag}-${base}"

          # Three archives from one build: the pair (the default -- the CLI
          # refuses a daemon built from a different version, so installing both
          # together is the path that cannot drift), and one per component for
          # the two cases that are real: a host that only runs the daemon, and a
          # client that only talks to a daemon elsewhere.
          mkdir -p "dist/$bundle" "dist/$daemon" "dist/$cli"
          cp target/release/andler target/release/andlerd LICENSE README.md "dist/$bundle/"
          cp target/release/andlerd LICENSE "dist/$daemon/"
          cp target/release/andler LICENSE "dist/$cli/"

          for dir in "$bundle" "$daemon" "$cli"; do
            tar -C dist -czf "dist/${dir}.tar.gz" "$dir"
            (cd dist && sha256sum "${dir}.tar.gz" > "${dir}.tar.gz.sha256")
          done

          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "daemon=$daemon" >> "$GITHUB_OUTPUT"
          echo "cli=$cli" >> "$GITHUB_OUTPUT"
          ls -lh dist

      - name: Smoke-check the packaged binaries
        run: |
          set -euo pipefail
          bundle="${{ steps.package.outputs.bundle }}"
          daemon="${{ steps.package.outputs.daemon }}"
          cli="${{ steps.package.outputs.cli }}"

          for archive in "$bundle" "$daemon" "$cli"; do
            (cd dist && sha256sum -c "${archive}.tar.gz.sha256" --status) \
              || { echo "::error::$archive failed its checksum"; exit 1; }
          done

          # The artifacts must carry exactly what their names promise.
          test "$(tar -tzf "dist/${daemon}.tar.gz" | grep -c '/andlerd$')" = 1
          test "$(tar -tzf "dist/${daemon}.tar.gz" | grep -c '/andler$')" = 0
          test "$(tar -tzf "dist/${cli}.tar.gz" | grep -c '/andler$')" = 1
          test "$(tar -tzf "dist/${cli}.tar.gz" | grep -c '/andlerd$')" = 0

          tar -xzf "dist/${bundle}.tar.gz" -C /tmp
          "/tmp/${bundle}/andler" --version
          "/tmp/${bundle}/andlerd" --version
          tar -xzf "dist/${daemon}.tar.gz" -C /tmp
          "/tmp/${daemon}/andlerd" --version
          tar -xzf "dist/${cli}.tar.gz" -C /tmp
          "/tmp/${cli}/andler" --version

      - name: Attest the build provenance
        # Artifact attestations are available for public repositories (and for
        # private ones on GitHub Enterprise Cloud). Skipping on a private repo
        # keeps the release publishable before the repository is opened; the
        # assets and their .sha256 sidecars are published either way.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz

      - name: Extract the changelog section
        id: notes
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          repo="${{ github.repository }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' docs/CHANGELOG.md > section.md
          if [ -s section.md ]; then
            # Same navigation row the README opens with, so the release reads as
            # part of the project rather than a detached changelog dump.
            {
              echo "**<a href=\"https://github.com/${repo}#readme\">README</a>** &nbsp;•&nbsp; **<a href=\"https://github.com/${repo}#-quick-start\">Quick start</a>** &nbsp;•&nbsp; **<a href=\"https://github.com/${repo}/blob/main/docs/CHANGELOG.md\">Changelog</a>** &nbsp;•&nbsp; **<a href=\"https://github.com/${repo}/blob/main/docs/ROADMAP.md\">Roadmap</a>**"
              echo
              sed '/./,$!d' section.md
            } > notes.md
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
            echo "::warning::docs/CHANGELOG.md has no section for $version - falling back to generated notes"
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            # Re-running for an existing tag rewrites the assets (--clobber) and
            # refreshes the body, so a release published with an older template
            # picks up the current one without burning a new tag.
            gh release upload "$tag" --repo "$repo" --clobber dist/*.tar.gz dist/*.sha256
            if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
              gh release edit "$tag" --repo "$repo" --title "$tag" --notes-file notes.md
            else
              gh release edit "$tag" --repo "$repo" --title "$tag"
            fi
          else
            # No --title: GitHub titles the release with the tag itself, which is
            # the version a reader needs; the project name is already the repo.
            if [ "${{ steps.notes.outputs.have_notes }}" = "true" ]; then
              gh release create "$tag" --repo "$repo" --latest \
                --notes-file notes.md dist/*.tar.gz dist/*.sha256
            else
              gh release create "$tag" --repo "$repo" --latest \
                --generate-notes dist/*.tar.gz dist/*.sha256
            fi
          fi
