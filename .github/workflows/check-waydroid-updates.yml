name: Check for new Waydroid images

# Runs on a schedule so nobody has to remember to check SourceForge by hand.
# workflow_dispatch is the manual "check right now" button in the Actions UI.
on:
  schedule:
    - cron: "0 6 * * *"   # once a day at 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report what would be built without triggering it"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # required to trigger build-base-image.yml

concurrency:
  group: check-waydroid-updates
  cancel-in-progress: true   # cheap and idempotent -- a fresher check can just supersede an older one

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # generous vs. the worst case in check_waydroid_updates.py's own retry math,
                           # just a safety net against an unexpected hang eating Actions minutes forever
    steps:
      - uses: actions/checkout@v6

      - name: Check SourceForge and trigger builds for anything new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_waydroid_updates.py \
            --repo "${{ github.repository }}" \
            --trigger-workflow build-base-image.yml \
            ${{ inputs.dry_run && '--dry-run' || '' }}
